[package]
name = "layline-codegen"
description = "Rust source generation for layline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/layline-codegen"
keywords.workspace = true
categories.workspace = true
include = ["/src", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["emit"]
walk = ["dep:proc-macro2", "dep:quote", "dep:syn"]
emit = ["walk", "dep:prettyplease", "syn/full"]

[dependencies]
layline-core = { workspace = true }
proc-macro2 = { version = "1", optional = true }
quote = { version = "1", optional = true }
syn = { version = "3", features = ["derive"], optional = true }
prettyplease = { version = "0.3", optional = true }

[dev-dependencies]
layline = { path = "../layline", features = ["alloc"] }
layline-core = { path = "../layline-core", features = ["num"] }

name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo hack clippy --workspace --each-feature --all-targets
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features
      - run: cargo test --workspace --release
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo hack build -p layline-core --feature-powerset --target thumbv7em-none-eabihf
      - run: cargo build -p layline --no-default-features --features derive --target thumbv7em-none-eabihf

  publish:
    if: github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ steps.auth.outputs.token }}
          ignore-unpublished-changes: true
